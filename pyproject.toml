[project]
name = "v-max"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.4",
    "jinja2>=3.1.6",
    "mcp>=1.0.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
